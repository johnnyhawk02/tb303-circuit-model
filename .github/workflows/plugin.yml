name: Plug-in
# Builds the 303 Circuit Model plug-in from the same commit the web app deployed:
#   macOS   VST3 + AU, Apple Silicon and Intel in one, signed ad hoc (not notarised: install.sh fetches it with curl)
#   Windows VST3 (64-bit), screen in Edge WebView2
#   Linux   VST3 (x86_64), screen in WebKitGTK 4.1
#  - after every Cloudflare deploy of main: checks the C++ engine against the web engine on Linux and Windows, builds
#    all three, and publishes them as the numbered release v<N> (N = the web app's version), marked Latest, so
#    https://github.com/johnnyhawk02/tb303-circuit-model/releases/latest/download/<file> always gets the newest
#  - on pull requests that touch the engine, the page or the plug-in: the same checks and builds, zips as artifacts
on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Pages"]
    types: [completed]
  pull_request:
    paths: ["plugin/**", "tb303-model.js", "src/**", "build.js", "irs/**", "fonts/**", "install.sh", "install.ps1", ".github/workflows/plugin.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plugin-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  VER: ${{ github.event_name == 'workflow_run' && format('v{0}', github.event.workflow_run.run_number) || 'dev' }}
jobs:
  parity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: engine tables match tb303-model.js
        run: node plugin/tools/gen-tables.js --check
      - name: C++ engine renders what the web engine renders
        run: node plugin/tests/parity.js

  mac:
    needs: parity
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: plug-in page from the web app
        run: node build.js && node plugin/tools/make-page.js plugin/build/page "$VER" "$SHA"
      - name: build
        run: |
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build plugin/build --config Release -j 4
      - name: sign (ad hoc) and zip
        run: |
          A="$PWD/plugin/build/TB303CircuitModel_artefacts/Release"
          mkdir -p pkg && cp -R "$A/VST3/303 Circuit Model.vst3" "$A/AU/303 Circuit Model.component" pkg/
          cp LICENSE irs/CREDITS.md fonts/OFL.txt pkg/
          cd pkg
          # "./": codesign reads a name that starts with digits ("303 ...") as a process id
          for B in "./303 Circuit Model.vst3" "./303 Circuit Model.component"; do
            codesign --force --sign - --timestamp=none "$B"
            codesign --verify --deep --strict "$B"
          done
          lipo -archs "303 Circuit Model.vst3/Contents/MacOS/303 Circuit Model"
          ditto -c -k . "$GITHUB_WORKSPACE/303-Circuit-Model-mac.zip"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: 303-Circuit-Model-mac.zip }

  windows:
    needs: parity
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: C++ engine renders what the web engine renders (MSVC)
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /O2 /fp:precise /EHsc /utf-8 plugin/tests/render.cpp /Fe:render.exe
          node plugin/tests/parity.js ./render.exe
      - name: WebView2 SDK (JUCE looks for it in the user's NuGet packages)
        shell: pwsh
        run: |
          Register-PackageSource -Provider NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force
      - name: plug-in page from the web app
        shell: bash
        run: node build.js && node plugin/tools/make-page.js plugin/build/page "$VER" "$SHA"
      - name: build
        shell: bash
        run: |
          cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64
          cmake --build plugin/build --config Release -j 4
      - name: zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item -Recurse "plugin/build/TB303CircuitModel_artefacts/Release/VST3/303 Circuit Model.vst3" pkg/
          Copy-Item LICENSE, irs/CREDITS.md, fonts/OFL.txt pkg/
          Compress-Archive -Path pkg/* -DestinationPath 303-Circuit-Model-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 303-Circuit-Model-windows.zip }

  linux:
    needs: parity
    # the oldest supported runner, so the plug-in runs on older glibc too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev
      - name: plug-in page from the web app
        run: node build.js && node plugin/tools/make-page.js plugin/build/page "$VER" "$SHA"
      - name: build
        run: |
          cmake -S plugin -B plugin/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build plugin/build -j 4
      - name: zip
        run: |
          mkdir pkg && cp -R "plugin/build/TB303CircuitModel_artefacts/Release/VST3/303 Circuit Model.vst3" pkg/
          cp LICENSE irs/CREDITS.md fonts/OFL.txt pkg/
          (cd pkg && zip -qry "$GITHUB_WORKSPACE/303-Circuit-Model-linux.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: 303-Circuit-Model-linux.zip }

  release:
    if: github.event_name == 'workflow_run'
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: publish the numbered release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp install.sh install.ps1 dist/
          cat > notes.md <<EOF
          303 Circuit Model $VER as a plug-in, built from ${SHA::7}. The same sound and screen as the web app $VER (https://tb303-circuit-model.pages.dev).

          **Mac** (VST3 + AU, Apple Silicon and Intel), **Linux** (VST3): open Terminal and run
          \`\`\`
          curl -fsSL https://github.com/johnnyhawk02/tb303-circuit-model/releases/latest/download/install.sh | bash
          \`\`\`
          **Windows** (VST3, 64-bit): open PowerShell and run
          \`\`\`
          irm https://github.com/johnnyhawk02/tb303-circuit-model/releases/latest/download/install.ps1 | iex
          \`\`\`
          Then rescan plug-ins in your DAW. Free software under the GNU AGPL v3, no warranty.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$VER" dist/* --target "$SHA" --latest --title "303 Circuit Model $VER" --notes-file notes.md
          # the old single-file mac pre-release is replaced by the numbered releases
          gh release delete plugin-latest --cleanup-tag --yes || true
